apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runner
  namespace: deepthink
  labels:
    app: agent-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-runner
  template:
    metadata:
      labels:
        app: agent-runner
    spec:
      containers:
      - name: agent-runner
        image: deepthink-server:latest
        imagePullPolicy: IfNotPresent
        command: ["node", "container/agent-runner/dist/index.js"]
        envFrom:
        - configMapRef:
            name: deepthink-config
        - secretRef:
            name: deepthink-secret
        env:
        - name: AGENT_RUNNER_MODE
          value: "distributed"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: CLAUDE_CONFIG_DIR
          value: "/data/.claude"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: deepthink-secret
              key: DATABASE_URL
        # Mount the shared PVC so the distributed runner can read/write user
        # files, memory, skills and IPC under the same /data layout as the
        # web-server pods. Without this the workspace is an empty ephemeral dir
        # and everything Claude Code creates is lost on pod restart.
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deepthink-data
      terminationGracePeriodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runner
  namespace: deepthink
spec:
  selector:
    app: agent-runner
  ports: []
  clusterIP: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-runner
  namespace: deepthink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-runner
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
