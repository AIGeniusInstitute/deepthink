# Kustomize bundle for DeepThink K8s deployment (multi-replica mode)
# Usage:
#   kubectl apply -k deploy/k8s/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  labels:
    app.kubernetes.io/name: deepthink
    app.kubernetes.io/version: "2.0"

namespace: deepthink

resources:
  - namespace.yaml
  - configmap.yaml
  # secret: 由 deploy.sh 或手动 `kubectl apply -f secret.yaml.example`(改名为 deepthink-secret.yaml)
  # 创建,不在 base 中 apply(secret.yaml.example 是模板,apply 会覆盖真实 secret)
  - pvc.yaml
  - redis.yaml
  - postgres.yaml
  - minio.yaml
  - elasticsearch.yaml
  - milvus.yaml
  - clickhouse.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - agent-runner.yaml
  - backup-cronjob.yaml

