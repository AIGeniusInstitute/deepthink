apiVersion: v1
kind: ConfigMap
metadata:
  name: deepthink-config
  namespace: deepthink
  labels:
    app.kubernetes.io/name: deepthink
data:
  # ─── Runtime ─────────────────────────────────
  DEEPTHINK_DATA_DIR: "/data"
  WEB_PORT: "9898"
  TZ: "Asia/Shanghai"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # ─── Web / Proxy ────────────────────────────
  TRUST_PROXY: "true"
  MAX_FILE_SIZE_MB: "50"

  # ─── Agent Runtime ──────────────────────────
  CONTAINER_IMAGE: "deepthink-agent:latest"

  # ─── Database (PostgreSQL for multi-pod) ────
  # Set in secret: DATABASE_URL=postgresql://user:pass@postgres:5432/deepthink
  # Leave empty for SQLite (single-replica mode)

  # ─── Redis (multi-pod shared state) ─────────
  # Points to the Redis service in the same namespace
  REDIS_URL: "redis://redis:6379"

  # ─── Object Store (large-file offload + Litestream target) ──
  # OBJECT_STORE_PROVIDER: fs (default, PVC) | s3 (MinIO/S3)
  # When s3, large trace I/O offloads to MinIO instead of local disk,
  # enabling stateless pods. See src/object-store.ts.
  OBJECT_STORE_PROVIDER: "fs"
  S3_BUCKET: "deepthink"
  S3_ENDPOINT: "http://minio:9000"
  S3_REGION: "us-east-1"
  S3_FORCE_PATH_STYLE: "true"

  # ─── Optional infra (not consumed by the app today; reserved for future features) ──
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  MILVUS_ADDR: "milvus:19530"
  CLICKHOUSE_URL: "http://clickhouse:8123"
