# Milvus — vector database for large-scale similarity search.
#
# Standalone mode: needs etcd (metadata) + object storage (reuses the existing
# MinIO service) + an embedded rocksmq message queue (no separate pulsar/kafka).
#
# NOTE: the DeepThink platform itself uses pgvector (PostgreSQL) for vector
# search and does NOT depend on Milvus. This manifest is provided as optional
# infrastructure for future features. See deploy/local/docker-compose.yml.

# ─── etcd (Milvus metadata store) ─────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: deepthink
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/component: milvus-dep
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/component: milvus-dep
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: etcd
          # registry.k8s.io/etcd is pre-loaded on the kind nodes (same image the
          # control-plane's etcd static pod uses) — avoids pulling from quay.io.
          image: registry.k8s.io/etcd:3.5.21-0
          imagePullPolicy: IfNotPresent
          command:
            - etcd
            - -advertise-client-urls=http://etcd:2379
            - -listen-client-urls=http://0.0.0.0:2379
            - --data-dir=/etcd-data
          ports:
            - name: client
              containerPort: 2379
              protocol: TCP
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
          readinessProbe:
            exec:
              command: ["etcdctl", "endpoint", "health"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 3Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: deepthink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
---
# ─── Milvus standalone ───────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  namespace: deepthink
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/component: vector-db
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milvus
        app.kubernetes.io/component: vector-db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.6
          imagePullPolicy: IfNotPresent
          command: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            - name: ETCD_ROOT_PATH
              value: "milvus/etcd"
            - name: MINIO_ADDRESS
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: deepthink-secret, key: S3_ACCESS_KEY_ID } }
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: deepthink-secret, key: S3_SECRET_ACCESS_KEY } }
            - name: MINIO_BUCKET_NAME
              value: "milvus"
            - name: COMMON_STORAGETYPE
              value: "remote"
          ports:
            - name: grpc
              containerPort: 19530
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: 9091 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 9091 }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1000m", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: deepthink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
    - name: metrics
      port: 9091
      targetPort: 9091
---
# ─── Auto-create the `milvus` bucket on the shared MinIO ─────
apiVersion: batch/v1
kind: Job
metadata:
  name: milvus-make-bucket
  namespace: deepthink
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MC_HOST_deepthink
              value: "http://$(S3_ACCESS_KEY_ID):$(S3_SECRET_ACCESS_KEY)@minio:9000"
          envFrom:
            - secretRef: { name: deepthink-secret }
          command:
            - sh
            - -c
            - |
              until mc ls deepthink 2>/dev/null; do sleep 2; done
              mc mb -p deepthink/milvus || true
              mc anonymous set none deepthink/milvus || true
