name: Test (smoke)

# 最小回归门禁：每个 pull_request 与 push 到 main 触发 `make test-smoke`
# （< 60s 纯逻辑单测集，见 Makefile test-smoke target）。
# 失败即阻断合并。完整 `make test` 仍由本地或发布前手动运行。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 生成产物一致性门禁：shared/ 是单向真相源，src/、web/src/、
      # container/agent-runner/src/ 下的副本由 make sync-types 生成且被 git 跟踪，
      # 因此一个正确的 commit 里副本必须与真相源逐字节相同。提交了不同步的副本
      # （例如把类型只加进副本）会让下一次构建的 sync 静默覆盖掉它，随后表现为
      # 莫名其妙的 tsc 报错——见 docs/issues/2026-09-29-stream-event-single-source-drift.md。
      #
      # 必须直接跑脚本，不能走 `make typecheck`：该 target 的前置依赖是 sync-types，
      # 会先把副本按真相源覆盖（即"治好"漂移），其后的 check 永远通过、形同虚设。
      # 这里跑的是 checkout 出来的提交状态，副本与真相源不一致必为真缺陷，无假阳性。
      - name: Check shared/ type copies are in sync
        run: ./scripts/check-stream-event-sync.sh

      # 刻意不开 `cache: 'npm'`：本仓库根目录的 package-lock.json 被 .gitignore
      # 忽略（依赖始终解析最新版本），CI checkout 后仓库内不存在任何 lockfile，
      # setup-node 的缓存步骤会直接报 "Dependencies lock file is not found" 并以
      # 非零退出码中止整个 job——install 与测试步骤全被跳过。详见
      # docs/issues/2026-09-24-ci-smoke-gate-never-ran.md
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --legacy-peer-deps 是必需的：仓库不跟踪 lockfile，每次都是全量解析依赖树，
      # 而 Node 22 自带的 npm 10 在 arborist 的 #loadPeerSet 里解析 vitest 的 peer
      # 依赖时会崩 `Cannot read properties of null (reading 'edgesOut')`（约 90s 后
      # 以 exit 1 结束）。跳过 peer 解析即可绕过。详见
      # docs/issues/2026-09-24-ci-smoke-gate-never-ran.md
      - name: Install deps (no-save, no audit)
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps

      # 测试清单的唯一真相源是 Makefile 的 test-smoke target。此前这里内联了
      # 一份只含 6 个文件的副本，与 Makefile 的 10 个文件长期不一致。
      - name: Run smoke tests
        run: make test-smoke
